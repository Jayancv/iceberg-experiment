name: kafka-iceberg

# Shared config for every Python container (producer, sink, query).
x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_TOPIC: events
  KAFKA_DLQ_TOPIC: events.dlq
  CATALOG_URI: http://rest:8181
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: admin
  S3_SECRET_KEY: password
  S3_REGION: us-east-1
  WAREHOUSE_BUCKET: warehouse
  ICEBERG_NAMESPACE: demo
  ICEBERG_TABLE: events
  PYTHONUNBUFFERED: "1"

x-app: &app
  build: ./app
  image: kafka-iceberg-app:local
  environment: *app-env

services:
  # --- Kafka (single-node KRaft, no ZooKeeper) ------------------------------
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      - "29092:29092"   # for clients on your host: localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic events     --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic events.dlq --partitions 1 --replication-factor 1
        $$T --bootstrap-server kafka:9092 --list
    restart: "no"

  # --- Object storage -------------------------------------------------------
  # MinIO stopped publishing community images in Oct 2025 (minio/minio is gone
  # from Docker Hub). pgsty/minio is a community fork on Docker Hub; this is its
  # final release under the "minio" name (later releases are pgsty/silo).
  # Pinned so CI doesn't change underneath us.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (admin / password)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - warehouse.minio   # lets virtual-host-style S3 clients resolve the bucket

  # --- Iceberg REST catalog -------------------------------------------------
  # Apache's reference REST catalog. Backed by in-memory SQLite: fine for a
  # sandbox, NOT durable (restarting this container forgets the tables).
  rest:
    image: apache/iceberg-rest-fixture:1.10.0
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- Pipeline -------------------------------------------------------------
  producer:
    <<: *app
    command: ["python", "producer.py"]
    environment:
      <<: *app-env
      EVENTS_PER_SECOND: "50"
      BAD_MESSAGE_RATE: "0.01"     # ~1% malformed messages, to exercise the DLQ
      LATE_EVENT_RATE: "0.05"      # ~5% events stamped up to 2 days in the past
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  sink:
    <<: *app
    command: ["python", "sink.py"]
    environment:
      <<: *app-env
      KAFKA_GROUP_ID: iceberg-sink
      BATCH_MAX_ROWS: "5000"
      BATCH_MAX_SECONDS: "15"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s   # give it time to flush the last batch on SIGTERM

  # One-shot: `docker compose run --rm query`
  query:
    <<: *app
    command: ["python", "query.py"]
    profiles: ["tools"]
    depends_on:
      rest:
        condition: service_healthy
