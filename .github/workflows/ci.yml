name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check app tests
      - run: pytest -q

  end-to-end:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull images (retry on registry errors)
        run: |
          for i in 1 2 3 4 5; do
            docker compose pull kafka minio rest && exit 0
            echo "pull failed (attempt $i), retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
          exit 1
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300 kafka minio rest
      - name: Start pipeline
        run: docker compose up -d producer sink
      - name: Let a few batches commit
        run: sleep 45
      - name: Crash the sink mid-batch, then restart it
        run: |
          docker compose kill -s SIGKILL sink
          sleep 5
          docker compose start sink
          sleep 45
      - name: Verify rows landed with no duplicates
        run: docker compose run --rm query
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
